name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  project7-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Project7_RetailSales_PySpark/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Project 7 dependencies
        run: python -m pip install -r Project7_RetailSales_PySpark/requirements.txt

      - name: Compile Python source
        run: python -m compileall -q Project7_RetailSales_PySpark

      - name: Validate shell scripts
        run: bash -n Project7_RetailSales_PySpark/scripts/*.sh

      - name: Validate Airflow DAG definition
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/project7-airflow
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/Project7_RetailSales_PySpark/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: python Project7_RetailSales_PySpark/dags/retail_sales_pyspark_pipeline.py

      - name: Run Project 7 PySpark tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: python -m pytest Project7_RetailSales_PySpark/tests -v
