version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: retail_postgres

    restart: always

    environment:
      POSTGRES_DB: retail_db
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


  environment:
  POSTGRES_USER:
  POSTGRES_PASSWORD:
  POSTGRES_DB: